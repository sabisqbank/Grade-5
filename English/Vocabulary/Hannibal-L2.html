    .subtitle {

    .status-bar {

      align-items: center;
      margin-bottom: 15px;
      font-weight: 600;

    .screen {

    }

    .screen.active {

    }

    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {

      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;

      width: 100%;
      text-align: center;

    .btn:hover {

    .question-prompt {

      font-weight: 600;
      margin-bottom: 15px;
      text-align: center;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background-color: #f9fafb;
      border: 2px solid #e5e7eb;
      color: var(--text-main);

      border-radius: 12px;
      font-size: 0.95rem;

    }

    .option-btn .label {
      font-weight: 700;
      margin-right: 12px;
      background: #e5e7eb;
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--text-main);

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--success);
      color: #065f46;

    .option-btn.correct .label {
      background-color: var(--success);

    .option-btn.incorrect {
      background-color: #fee2e2;
      border-color: var(--error);
      color: #991b1b;
    }

    .option-btn.incorrect .label {
      background-color: var(--error);

    .option-btn.disabled {

    .feedback-banner {
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback-banner.correct {
      background-color: #d1fae5;

    }

    @keyframes fadeIn {

    }

</head>

    let currentMode = 'full';
    let activeQuizList = [];
    let currentIndex = 0;
    let score = 0;
    let incorrectWords = [];
    let isAnswered = false;

    function shuffle(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showMenu() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-menu').classList.add('active');
    }

    function startGame(mode) {
      currentMode = mode;
      score = 0;
      currentIndex = 0;
      incorrectWords = [];

      if (mode === 'quick') {
        activeQuizList = shuffle(vocabData).slice(0, 10);
      } else {
        activeQuizList = shuffle(vocabData);
      }

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-game').classList.add('active');
      
      loadQuestion();
    }

    function startReviewMode() {
      activeQuizList = shuffle([...incorrectWords]);
      incorrectWords = [];
      score = 0;
      currentIndex = 0;
      currentMode = 'review';

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-game').classList.add('active');

      loadQuestion();
    }

      isAnswered = false;
      const currentItem = activeQuizList[currentIndex];

      document.getElementById('question-tracker').textContent = `Question ${currentIndex + 1} of ${activeQuizList.length}`;
      document.getElementById('score-tracker').textContent = currentMode === 'practice' ? `Practice Mode` : `Score: ${score}`;
      
      const progressPercent = ((currentIndex) / activeQuizList.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      document.getElementById('target-word').textContent = currentItem.word;
      document.getElementById('context-sentence').textContent = currentItem.context;

      document.getElementById('feedback-banner').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const options = shuffle([
        { text: currentItem.correct, isCorrect: true },
        { text: currentItem.distractors[0], isCorrect: false },
        { text: currentItem.distractors[1], isCorrect: false },
        { text: currentItem.distractors[2], isCorrect: false }
      ]);

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="label">${labels[index]}</span> ${opt.text}`;
        btn.onclick = () => selectAnswer(btn, opt.isCorrect, currentItem);
        container.appendChild(btn);
      });
    }

    function selectAnswer(selectedBtn, isCorrect, item) {
      if (isAnswered) return;
      isAnswered = true;

      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(btn => btn.classList.add('disabled'));

      const banner = document.getElementById('feedback-banner');
      const title = document.getElementById('feedback-title');
      const details = document.getElementById('feedback-details');

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        banner.className = 'feedback-banner correct';
        title.textContent = '🎉 Correct! Great job!';
        details.textContent = `"${item.word}" means: ${item.correct}`;
        if (currentMode !== 'practice') score++;
      } else {
        selectedBtn.classList.add('incorrect');
        
        allBtns.forEach(btn => {
          if (btn.textContent.includes(item.correct)) {
            btn.classList.add('correct');
          }
        });

        banner.className = 'feedback-banner incorrect';
        title.textContent = '❌ Not quite!';
        details.innerHTML = `<strong>Correct answer:</strong> ${item.correct}`;
        
        if (!incorrectWords.some(w => w.word === item.word)) {
          incorrectWords.push(item);
        }
      }

      banner.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
      document.getElementById('score-tracker').textContent = currentMode === 'practice' ? `Practice Mode` : `Score: ${score}`;
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < activeQuizList.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-results').classList.add('active');

      const total = activeQuizList.length;
      const percentage = Math.round((score / total) * 100);

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-correct').textContent = score;
      document.getElementById('stat-incorrect').textContent = total - score;
      document.getElementById('score-percentage').textContent = `${percentage}%`;

      let badge = '🏆';
      let title = 'Vocabulary Master!';

      if (percentage >= 90) {
        badge = '🏆';
        title = 'Vocabulary Master!';
      } else if (percentage >= 80) {
        badge = '🌟';
        title = 'Excellent!';
      } else if (percentage >= 70) {
        badge = '👍';
        title = 'Good Job!';
      } else if (percentage >= 60) {
        badge = '📚';
        title = 'Keep Practicing!';
      } else {
        badge = '💪';
        title = 'Keep Learning!';
      }

      document.getElementById('badge-icon').textContent = badge;
      document.getElementById('performance-title').textContent = title;

      const reviewBtn = document.getElementById('review-btn');
      if (incorrectWords.length > 0) {
        reviewBtn.style.display = 'block';
        reviewBtn.textContent = `🔁 Review Mistakes (${incorrectWords.length})`;
      } else {
        reviewBtn.style.display = 'none';
      }
    }
  </script>
</body>
</html>
